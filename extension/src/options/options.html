<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Likelyread options</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="options.css">
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <p class="wordmark">likelyread</p>
    <h1>Connect your server</h1>
    <p class="lead">Paste the setup link the installer printed. You also find it on your dashboard, under Connect.</p>
    <form id="form">
      <label for="setupLink">Setup link</label>
      <input id="setupLink" placeholder="https://t.example.com/#connect=…" autocomplete="off" spellcheck="false">
      <p class="hint" id="linkHint">It fills in the address and token below.</p>
      <label for="serverUrl">Server address</label>
      <input id="serverUrl" placeholder="https://t.example.com" required>
      <label for="token">Token</label>
      <input id="token" type="password" placeholder="Paste the token" required>
      <label class="check"><input id="trackByDefault" type="checkbox"> Track new emails by default</label>
      <label for="campaign">Campaign for new emails (optional)</label>
      <input id="campaign" placeholder="e.g. Q4 outreach" maxlength="100">
      <div class="actions">
        <button type="submit" class="primary" id="save">Save</button>
        <button type="button" id="test">Test connection</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </main>
</body>
</html>
